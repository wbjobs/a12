version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: ebpf-apm-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    environment:
      - CLICKHOUSE_DB=ebpf_apm
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config.d/custom-config.xml
    configs:
      - source: clickhouse-config
        target: /etc/clickhouse-server/config.d/custom-config.xml
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init_clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ebpf-apm

  ebpf-apm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebpf-apm-agent
    privileged: true
    pid: host
    network_mode: host
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=127.0.0.1
      - CLICKHOUSE_PORT=9000
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - ./config.yaml:/app/config.yaml
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command: >
      sh -c "
        echo 'Waiting for ClickHouse to be ready...'
        while ! curl -s http://127.0.0.1:8123/ping > /dev/null; do
          sleep 1
        done
        echo 'Initializing schema...'
        /usr/local/bin/ebpf-apm --config /app/config.yaml --init-schema
        echo 'Starting eBPF APM agent...'
        exec /usr/local/bin/ebpf-apm --config /app/config.yaml
      "
    restart: unless-stopped

volumes:
  clickhouse_data:

configs:
  clickhouse-config:
    file: ./scripts/clickhouse-config.xml

networks:
  ebpf-apm:
    driver: bridge
