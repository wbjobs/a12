server:
  http_port: 8080
  grpc_port: 50051

clickhouse:
  host: localhost
  port: 9000
  database: ebpf_apm
  username: default
  password: ""
  max_open_conns: 50
  max_idle_conns: 10
  batch_size: 10000
  queue_capacity: 100000
  flush_interval_seconds: 5
  max_retries: 3

sampling:
  high_latency_threshold_ms: 500
  high_latency_sample_rate: 1.0
  low_latency_sample_rate: 0.01

ebpf:
  perf_buffer_size: 8192
  poll_timeout_ms: 100

protocols:
  http:
    enabled: true
    ports: [80, 8080, 3000, 8000, 9090]
  grpc:
    enabled: true
    ports: [50051, 9000, 7000]
  redis:
    enabled: true
    ports: [6379]

anomaly:
  enabled: true
  alpha: 0.2
  deviation_threshold: 3.0
  min_samples: 100
  cooldown_seconds: 60
  alertmanager:
    enabled: false
    url: "http://localhost:9093"
    timeout_ms: 1000

compression:
  enabled: true
  compression_level: 3
  max_cache_size: 10000
  similarity_threshold: 0.9

flamegraph:
  enabled: true
  default_width: 1200
  height_per_frame: 18
  max_depth: 100

envoy:
  enabled: true
  detect_all_ports: false
